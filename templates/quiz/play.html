{% extends 'home.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title">Викторина</h2>
        <p class="text-muted">Текущая серия: {{ streak }}</p>
        {% if question %}
          <form method="post">
            {% csrf_token %}
            {{ form.question_id }}
            <p class="fw-semibold mb-2">Вопрос:</p>
            <p>{{ question.text }}</p>
            <div class="mb-3">
              {{ form.answer }}
            </div>
            <button type="submit" class="btn btn-primary">Ответить</button>
          </form>
        {% else %}
          <div class="alert alert-info">Пока нет вопросов.</div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
