{% extends 'home.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title mb-3">Вход</h2>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form.as_p }}
          <input type="hidden" name="next" value="{{ next }}" />
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
        <p class="mt-3 mb-0">Нет аккаунта? <a href="{% url 'accounts:register' %}">Регистрация</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
